name: TestFlight

# Ships Endgame Fitness to TestFlight. There is no Xcode on the development
# machine, so every archive, signature and upload happens here.
#
# This is modelled on danielalanbates/descend-watch, which is the pipeline that
# has actually put builds on TestFlight from this Apple account. Two things in
# particular are copied deliberately rather than done the "documented" way:
#
#   * The .ipa is packaged by hand (zip a Payload/ directory) instead of using
#     `xcodebuild -exportArchive`, which is fragile and needs an export plist
#     that keeps drifting out of date.
#   * Upload goes through the Build Upload REST API (scripts/upload_asc.py)
#     rather than altool, which has proven unreliable here.
#
# SECRET NAMES MATCH descend-watch ON PURPOSE, so the same values can be pasted
# straight across:
#
#   ASC_KEY_ID       App Store Connect API key id (e.g. 32R84GFV2F)
#   ASC_ISSUER_ID    ASC API issuer id (UUID) — get from App Store Connect ->
#                    Users and Access -> Integrations -> App Store Connect API
#   ASC_KEY_P8       contents of AuthKey_XXXX.p8
#   DIST_P12_B64     base64 of the Apple Distribution .p12
#   DIST_P12_PASS    password for that .p12
#   PROVISION_IOS_B64    base64 of the iOS App Store .mobileprovision for
#                        org.batesai.endgamefitness
#   PROVISION_MACOS_B64  base64 of the macOS App Store .provisionprofile
#   INSTALLER_P12_B64  base64 of the Mac Installer Distribution .p12 (macOS only)
#   ASC_APP_ID       the numeric app id from the App Store Connect URL
#
# Encode a file with:  base64 -i cert.p12 | pbcopy

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which platform to ship
        required: true
        default: ios
        type: choice
        options: [ios, macos, both]
      version:
        description: Marketing version
        required: false
        default: "1.0.0"
        type: string
      build_number:
        description: Build number (defaults to the run number)
        required: false
        type: string

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  ship:
    runs-on: macos-15
    env:
      APP_ID: ${{ secrets.ASC_APP_ID }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, macos]

    steps:
      - name: Skip unselected platform
        id: gate
        run: |
          want="${{ inputs.platform }}"
          if [ "$want" = "both" ] || [ "$want" = "${{ matrix.platform }}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping ${{ matrix.platform }}"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - name: Select Xcode
        if: steps.gate.outputs.run == 'true'
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Install XcodeGen
        if: steps.gate.outputs.run == 'true'
        run: brew install xcodegen

      - name: Generate project
        if: steps.gate.outputs.run == 'true'
        working-directory: App
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: xcodegen generate --spec project.yml

      - name: Import signing certificate and profile
        if: steps.gate.outputs.run == 'true'
        env:
          DIST_P12_B64: ${{ secrets.DIST_P12_B64 }}
          DIST_P12_PASS: ${{ secrets.DIST_P12_PASS }}
          PROVISION_IOS_B64: ${{ secrets.PROVISION_IOS_B64 }}
          PROVISION_MACOS_B64: ${{ secrets.PROVISION_MACOS_B64 }}
          INSTALLER_P12_B64: ${{ secrets.INSTALLER_P12_B64 }}
        run: |
          echo "$DIST_P12_B64" | base64 -d > dist.p12
          security create-keychain -p ci ci.keychain
          security default-keychain -s ci.keychain
          security unlock-keychain -p ci ci.keychain
          security set-keychain-settings -lut 21600 ci.keychain
          security import dist.p12 -k ci.keychain -P "$DIST_P12_PASS" -T /usr/bin/codesign
          if [ "${{ matrix.platform }}" = "macos" ] && [ -n "$INSTALLER_P12_B64" ]; then
            # Same private key as the distribution cert, different leaf: signs the
            # .pkg that TestFlight for Mac requires.
            echo "$INSTALLER_P12_B64" | base64 -d > installer.p12
            security import installer.p12 -k ci.keychain -P "$DIST_P12_PASS" -T /usr/bin/productbuild
          fi
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: -s -k ci ci.keychain
          security find-identity -v ci.keychain

          # Xcode looks in one of these two directories depending on version;
          # descend-watch writes both, so do the same.
          mkdir -p ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          if [ "${{ matrix.platform }}" = "ios" ]; then
            echo "$PROVISION_IOS_B64" | base64 -d \
              > ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles/endgame.mobileprovision
          else
            echo "$PROVISION_MACOS_B64" | base64 -d \
              > ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles/endgame.provisionprofile
          fi
          cp ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles/* \
             ~/Library/MobileDevice/Provisioning\ Profiles/ 2>/dev/null || true

      - name: Archive
        if: steps.gate.outputs.run == 'true'
        working-directory: App
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          set -eo pipefail
          BUILD_NUMBER="${{ inputs.build_number }}"
          [ -z "$BUILD_NUMBER" ] && BUILD_NUMBER="${{ github.run_number }}"

          if [ "${{ matrix.platform }}" = "ios" ]; then
            SCHEME="EndgameFitness-iOS"; DEST="generic/platform=iOS"
          else
            SCHEME="EndgameFitness-macOS"; DEST="generic/platform=macOS"
          fi

          xcodebuild -project EndgameFitness.xcodeproj -scheme "$SCHEME" \
            -destination "$DEST" -configuration Release \
            -archivePath "$GITHUB_WORKSPACE/build/EndgameFitness.xcarchive" \
            MARKETING_VERSION="${{ inputs.version }}" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            archive

      - name: Inspect archive
        if: steps.gate.outputs.run == 'true'
        run: |
          find build/EndgameFitness.xcarchive -maxdepth 3 -print
          plutil -p build/EndgameFitness.xcarchive/Info.plist || true

      - name: Package artifact
        if: steps.gate.outputs.run == 'true'
        id: package
        run: |
          set -eo pipefail
          APPS=build/EndgameFitness.xcarchive/Products/Applications
          APP_NAME=$(ls "$APPS" | head -1)
          echo "app: $APP_NAME"

          if [ "${{ matrix.platform }}" = "ios" ]; then
            # Hand-rolled .ipa: an .ipa is just a zip with the app under Payload/.
            cd "$APPS"
            mkdir -p Payload
            cp -R "$APP_NAME" Payload/
            zip -qry EndgameFitness.ipa Payload
            cd -
            echo "artifact=$APPS/EndgameFitness.ipa" >> "$GITHUB_OUTPUT"
          else
            # macOS TestFlight takes a signed .pkg, not a zip.
            productbuild --component "$APPS/$APP_NAME" /Applications \
              --sign "Mac Installer Distribution: Daniel Bates (MG4YW8XX2Z)" --keychain ci.keychain \
              build/EndgameFitness.pkg
            echo "artifact=build/EndgameFitness.pkg" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to TestFlight (Build Upload API, needs ASC_APP_ID)
        if: steps.gate.outputs.run == 'true' && env.APP_ID != ''
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          IPA_PATH: ${{ steps.package.outputs.artifact }}
          VER: ${{ inputs.version }}
        run: |
          set -eo pipefail
          BUILD_NUMBER="${{ inputs.build_number }}"
          [ -z "$BUILD_NUMBER" ] && BUILD_NUMBER="${{ github.run_number }}"
          if [ "${{ matrix.platform }}" = "ios" ]; then
            export PLATFORM=IOS
          else
            export PLATFORM=MAC_OS
          fi
          pip3 install --quiet --break-system-packages PyJWT cryptography \
            || pip3 install --quiet PyJWT cryptography
          BUILD="$BUILD_NUMBER" python3 scripts/upload_asc.py

      # Pathway B — no app record exists yet (ASC_APP_ID unset). The REST API
      # cannot create one, but Xcode's own uploader can: `-exportArchive` with
      # destination=upload registers the app in App Store Connect on first
      # upload, using the bundle id + CFBundleDisplayName. Once that has run
      # successfully, copy the numeric app id into ASC_APP_ID and the API path
      # above takes over.
      - name: Upload to TestFlight (xcodebuild exportArchive, creates the app record)
        if: steps.gate.outputs.run == 'true' && env.APP_ID == ''
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -eo pipefail
          mkdir -p ~/.private_keys
          echo "$ASC_KEY_P8" > ~/.private_keys/AuthKey_${ASC_KEY_ID}.p8
          if [ "${{ matrix.platform }}" = "ios" ]; then PROFILE="Endgame Fitness IOS_APP_STORE"; else PROFILE="Endgame Fitness MAC_APP_STORE"; fi
          sed -i '' "s/__PROFILE__/$PROFILE/" App/ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath build/EndgameFitness.xcarchive \
            -exportOptionsPlist App/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          ls -la build/export || true
          cat build/export/*.plist 2>/dev/null || true

      - name: Keep the artifact
        if: steps.gate.outputs.run == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: endgame-fitness-${{ matrix.platform }}
          path: |
            build/EndgameFitness.xcarchive/Products/Applications/*.ipa
            build/*.pkg
          if-no-files-found: ignore
