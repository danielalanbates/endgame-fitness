name: Build

# Compile the macOS app on every push (iOS + backend archived 2026-11-16).
#
# No signing here — `CODE_SIGNING_ALLOWED=NO` means this runs without any
# secrets and still catches every compile error. Shipping is testflight.yml.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            scheme: EndgameFitness-macOS
            destination: platform=macOS,arch=arm64

    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: App
        run: xcodegen generate --spec project.yml

      - name: Build
        working-directory: App
        run: |
          set -o pipefail
          xcodebuild build \
            -project EndgameFitness.xcodeproj \
            -scheme "${{ matrix.scheme }}" \
            -destination "${{ matrix.destination }}" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            | xcbeautify || xcodebuild build \
            -project EndgameFitness.xcodeproj \
            -scheme "${{ matrix.scheme }}" \
            -destination "${{ matrix.destination }}" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

