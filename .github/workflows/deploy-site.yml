name: Deploy batesai.org

# Ships the whole batesai.org site (Cloudflare Pages project `website`), including
# the Endgame Fitness PWA at /fitness/ — no Mac required.
#
# One-time setup (do on your phone):
#   1. dash.cloudflare.com -> My Profile -> API Tokens -> Create Token -> Custom:
#      Account permissions: Cloudflare Pages [Edit] -> create, copy it.
#      (Least privilege: no D1 permission needed. The fitness backend falls
#      back gracefully when the membership_tier column is absent.)
#   2. github.com/danielalanbates/endgame-fitness -> Settings -> Secrets and
#      variables -> Actions -> New repository secret:
#      name  CLOUDFLARE_API_TOKEN
#      value <the token from step 1>
#   3. Actions tab -> "Deploy batesai.org" -> Run workflow -> Run workflow.
#
# Every later deploy is just step 3. This mirrors App/Backend/deploy.sh
# (the Mac script), which remains the manual alternative.

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout endgame-fitness
        uses: actions/checkout@v4
        with:
          path: endgame
          fetch-depth: 1

      - name: Checkout website
        uses: actions/checkout@v4
        with:
          repository: danielalanbates/website
          path: site
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build fitness PWA
        working-directory: endgame/Web/fitness-pwa
        run: |
          npm ci
          npm run build

      - name: Sync Pages Functions + PWA into site
        run: |
          set -euo pipefail
          mkdir -p site/functions/api/auth site/functions/api/fitness site/functions/_lib
          cp "endgame/App/Backend/functions/api/auth/[[path]].js" "site/functions/api/auth/[[path]].js"
          cp "endgame/App/Backend/functions/api/fitness/[[path]].js" "site/functions/api/fitness/[[path]].js"
          cp endgame/App/Backend/functions/_lib/*.js site/functions/_lib/
          rm -rf site/dist/fitness
          mkdir -p site/dist/fitness
          cp -r endgame/Web/fitness-pwa/dist/. site/dist/fitness/
          test -f site/dist/fitness/index.html
          echo "fitness PWA staged: $(du -sh site/dist/fitness | cut -f1)"

      - name: Deploy to Cloudflare Pages
        working-directory: site
        run: npx -y wrangler pages deploy dist --project-name=website --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
