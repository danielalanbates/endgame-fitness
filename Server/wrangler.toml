name = "endgame-fitness"
main = "worker.mjs"
compatibility_date = "2026-11-18"
workers_dev = true
# Only Endgame API requests are intercepted. Pages serves the app at
# /endgamefitness/ and handles BatesAI Membership callbacks.
routes = [
  { pattern = "batesai.org/api/endgame/*", zone_name = "batesai.org" }
]
[assets]
directory = "../build/web"
binding = "ASSETS"
run_worker_first = true
[[d1_databases]]
binding = "DB"
database_name = "batesai-db"
database_id = "9e43d1f6-b25f-4cab-87da-9669dc4148d2"
migrations_dir = "migrations"
