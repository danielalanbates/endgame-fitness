# XcodeGen spec for Endgame Fitness.
#
# The .xcodeproj is generated (locally or in CI) rather than
# committed, so the spec here is the source of truth. Regenerate with:
#
#   xcodegen generate --spec App/project.yml
#
# macOS only for now (iOS target archived 2026-11-16). Platform-specific code
# stays behind `#if os(...)` in Platform.swift so iOS can be restored.

name: EndgameFitness

options:
  bundleIdPrefix: org.batesai
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Manual
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  EndgameFitness-macOS:
    type: application
    platform: macOS
    sources:
      - path: Sources/EndgameFitness
      # xcodegen has no `resources:` key — asset catalogs listed under sources
      # land in the Copy Bundle Resources phase automatically.
      - path: Resources/Assets.xcassets
      # 876 exercises from free-exercise-db (The Unlicense / public domain).
      - path: Resources/exercise_library.json
        buildPhase: resources
      # Required-reason API + collected-data declarations (App Store privacy manifest).
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Endgame Fitness
        PRODUCT_BUNDLE_IDENTIFIER: org.batesai.endgamefitness
        INFOPLIST_FILE: Support/Info-macOS.plist
        # Manual signing for the App Store / TestFlight archive. xcodegen's
        # platform default ("Mac Developer") would override a base-level setting,
        # so the identity is pinned per target (lesson from descend-watch).
        CODE_SIGN_IDENTITY: "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER: "Endgame Fitness MAC_APP_STORE"
        SKIP_INSTALL: NO
        INSTALL_PATH: /Applications
        CODE_SIGN_ENTITLEMENTS: Support/EndgameFitness-macOS.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
    # xcodegen REWRITES the entitlements file from `properties` on every generate
    # (an entry with only `path` produces an empty plist) — keep the real
    # entitlements here, never edit the .entitlements files by hand.
    entitlements:
      path: Support/EndgameFitness-macOS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        # Gym Party (MultipeerConnectivity) accepts incoming peer connections.
        com.apple.security.network.server: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.developer.game-center: true

  # iOS target archived 2026-11-16 (Mac first): _archive/accounts-and-ios-2026-11-16/

schemes:
  EndgameFitness-macOS:
    build:
      targets:
        EndgameFitness-macOS: all
    archive:
      config: Release
